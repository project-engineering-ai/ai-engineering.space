baseURL = "https://ai-engineering.space/"
theme = "mana"
title = "AI Engineering — ИИ в управлении производством"
copyright = "© AI Engineering"
languageCode = "ru"
DefaultContentLanguage = "ru"
enableInlineShortcodes = true

# Пагинация списка постов
[pagination]
pageSize = 10

# Форматы вывода: JSON на главной нужен для полнотекстового поиска темы
[outputs]
home = ["HTML", "JSON"]

[sitemap]
changefreq = "weekly"
priority = 0.5
filename = "sitemap.xml"

[markup]
  # Оглавление в постах
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      # Блочные атрибуты — нужны для алертов/адмонишнов темы (> [!NOTE] и т.п.)
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  # Подсветка кода (Catppuccin)
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    style = "catppuccin-macchiato"

[params]
noindex = false
description = "Внедряем искусственный интеллект в управление производством."
author = "AI Engineering"
heroTitleLine1 = "AI ENGINEERING"
heroTitleLine2 = "ИИ в управлении производством"
footerText = "AI Engineering — ИИ в управлении производством"
favicon = "/favicon.png"
relatedPostsCount = 3

  # Аватар: минимальный логотип (assets/images/logo.png)
  [params.avatar]
  assetPath = "images/logo.png"
  enableResize = true

  [params.social]
  github = "https://github.com/project-engineering-ai"
  email = "info@ai-engineering.space"

  [params.codeHighlight]
  darkTheme = "catppuccin-macchiato"
  lightTheme = "catppuccin-frappe"

  [params.copyright]
  startYear = 2026
  owner = "AI Engineering"

  [params.admonitions]
  alertStyle = "favicon"

[taxonomies]
category = "categories"
tag = "tags"

[menu]
  [[menu.main]]
    identifier = "about"
    name = "О компании"
    url = "/about/"
    weight = 10
  [[menu.main]]
    identifier = "solutions"
    name = "Решения"
    url = "/solutions/"
    weight = 20
  [[menu.main]]
    identifier = "post"
    name = "Блог"
    url = "/post/"
    weight = 30
  [[menu.main]]
    identifier = "contact"
    name = "Контакты"
    url = "/contact/"
    weight = 40
