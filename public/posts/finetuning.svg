<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="Poppins, sans-serif">
  <defs>
    <linearGradient id="d3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A121E"/>
      <stop offset="1" stop-color="#231520"/>
    </linearGradient>
  </defs>
  <rect width="800" height="640" fill="url(#d3)"/>
  <circle cx="710" cy="560" r="150" fill="#5794E0" opacity="0.07"/>

  <!-- examples: instruction/response pairs -->
  <g transform="translate(90,90)">
    <rect width="250" height="66" rx="12" fill="#223A5E" stroke="#5794E0" stroke-width="2"/>
    <rect x="20" y="18" width="90" height="8" rx="4" fill="#5794E0"/>
    <rect x="20" y="38" width="180" height="8" rx="4" fill="#3A5A85"/>
    <rect y="86" width="250" height="66" rx="12" fill="#223A5E" stroke="#5794E0" stroke-width="2"/>
    <rect x="20" y="104" width="110" height="8" rx="4" fill="#5794E0"/>
    <rect x="20" y="124" width="170" height="8" rx="4" fill="#3A5A85"/>
    <rect y="172" width="250" height="66" rx="12" fill="#223A5E" stroke="#5794E0" stroke-width="2"/>
    <rect x="20" y="190" width="80" height="8" rx="4" fill="#5794E0"/>
    <rect x="20" y="210" width="190" height="8" rx="4" fill="#3A5A85"/>
  </g>
  <text x="215" y="380" fill="#8FA9C9" font-size="18" text-anchor="middle">Примеры instruction/response</text>

  <path d="M 370 240 H 430" stroke="#5794E0" stroke-width="4" marker-end="url(#a3)"/>

  <!-- validation: train/val/test donut -->
  <g transform="translate(560,230)">
    <circle r="105" fill="none" stroke="#1B3050" stroke-width="34"/>
    <!-- train ~70% -->
    <path d="M 0 -105 A 105 105 0 1 1 -102.6 22.5" fill="none" stroke="#5794E0" stroke-width="34"/>
    <!-- val ~18% -->
    <path d="M -102.6 22.5 A 105 105 0 0 1 -33.5 99.5" fill="none" stroke="#58C184" stroke-width="34"/>
    <!-- test ~12% remains dark -->
  </g>
  <text x="560" y="385" fill="#8FA9C9" font-size="18" text-anchor="middle" opacity="0">.</text>

  <!-- legend -->
  <g transform="translate(430,470)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#5794E0"/>
    <text x="24" y="12" fill="#8FA9C9" font-size="16">train</text>
    <rect x="90" y="0" width="14" height="14" rx="3" fill="#58C184"/>
    <text x="114" y="12" fill="#8FA9C9" font-size="16">val</text>
    <rect x="170" y="0" width="14" height="14" rx="3" fill="#1B3050" stroke="#3A5A85"/>
    <text x="194" y="12" fill="#8FA9C9" font-size="16">test</text>
  </g>
  <text x="520" y="540" fill="#8FA9C9" font-size="18" text-anchor="middle">Разбиение без утечек</text>

  <marker id="a3" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5794E0"/>
  </marker>
</svg>
