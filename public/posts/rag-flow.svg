<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="Poppins, sans-serif">
  <defs>
    <linearGradient id="d2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A121E"/>
      <stop offset="1" stop-color="#12233A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="640" fill="url(#d2)"/>
  <circle cx="90" cy="560" r="150" fill="#58C184" opacity="0.07"/>

  <!-- user query bubble -->
  <g transform="translate(90,90)">
    <rect width="230" height="70" rx="35" fill="#223A5E" stroke="#5794E0" stroke-width="2"/>
    <circle cx="36" cy="35" r="14" fill="none" stroke="#5794E0" stroke-width="3"/>
    <line x1="46" y1="45" x2="58" y2="57" stroke="#5794E0" stroke-width="3" stroke-linecap="round"/>
    <rect x="80" y="26" width="120" height="7" rx="3.5" fill="#3A5A85"/>
    <rect x="80" y="40" width="90" height="7" rx="3.5" fill="#3A5A85"/>
  </g>

  <!-- arrow down -->
  <path d="M 205 175 V 235" stroke="#5794E0" stroke-width="4" marker-end="url(#a2)"/>

  <!-- chunk index: grid of chunks, 2 highlighted -->
  <g transform="translate(80,260)">
    <rect width="250" height="230" rx="14" fill="#223A5E" stroke="#5794E0" stroke-width="2"/>
    <g fill="#1B3050" stroke="#3A5A85">
      <rect x="22" y="24" width="94" height="40" rx="6"/>
      <rect x="134" y="24" width="94" height="40" rx="6"/>
      <rect x="22" y="80" width="94" height="40" rx="6"/>
      <rect x="134" y="80" width="94" height="40" rx="6"/>
      <rect x="22" y="136" width="94" height="40" rx="6"/>
      <rect x="134" y="136" width="94" height="40" rx="6"/>
      <rect x="22" y="176" width="206" height="30" rx="6"/>
    </g>
    <rect x="22" y="24" width="94" height="40" rx="6" fill="#1B3050" stroke="#58C184" stroke-width="3"/>
    <rect x="134" y="136" width="94" height="40" rx="6" fill="#1B3050" stroke="#58C184" stroke-width="3"/>
  </g>
  <text x="205" y="530" fill="#8FA9C9" font-size="18" text-anchor="middle">Индекс чанков</text>

  <!-- arrow right -->
  <path d="M 350 375 H 410" stroke="#5794E0" stroke-width="4" marker-end="url(#a2)"/>

  <!-- answer with citations -->
  <g transform="translate(430,250)">
    <rect width="280" height="250" rx="14" fill="#223A5E" stroke="#58C184" stroke-width="2"/>
    <rect x="24" y="26" width="150" height="10" rx="5" fill="#58C184"/>
    <g fill="#3A5A85">
      <rect x="24" y="56" width="230" height="8" rx="4"/>
      <rect x="24" y="76" width="230" height="8" rx="4"/>
      <rect x="24" y="96" width="190" height="8" rx="4"/>
      <rect x="24" y="126" width="230" height="8" rx="4"/>
      <rect x="24" y="146" width="210" height="8" rx="4"/>
    </g>
    <!-- citation chips -->
    <rect x="24" y="176" width="60" height="22" rx="11" fill="none" stroke="#5794E0" stroke-width="2"/>
    <text x="54" y="191" fill="#5794E0" font-size="13" text-anchor="middle">ист. 1</text>
    <rect x="96" y="176" width="60" height="22" rx="11" fill="none" stroke="#5794E0" stroke-width="2"/>
    <text x="126" y="191" fill="#5794E0" font-size="13" text-anchor="middle">ист. 2</text>
    <rect x="24" y="210" width="90" height="8" rx="4" fill="#3A5A85"/>
  </g>
  <text x="570" y="530" fill="#8FA9C9" font-size="18" text-anchor="middle">Ответ со ссылками на документы</text>

  <marker id="a2" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5794E0"/>
  </marker>
</svg>
