<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="Poppins, sans-serif">
  <defs>
    <linearGradient id="d1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A121E"/>
      <stop offset="1" stop-color="#12233A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="640" fill="url(#d1)"/>
  <circle cx="700" cy="80" r="140" fill="#5794E0" opacity="0.08"/>

  <!-- raw docs stack (left, messy) -->
  <g transform="translate(90,140)">
    <rect x="14" y="-20" width="110" height="150" rx="8" fill="#1B3050" stroke="#3A5A85" transform="rotate(-9)"/>
    <rect x="6" y="-10" width="110" height="150" rx="8" fill="#1B3050" stroke="#3A5A85" transform="rotate(-4)"/>
    <rect width="110" height="150" rx="8" fill="#223A5E" stroke="#5794E0" stroke-width="2"/>
    <rect x="14" y="20" width="60" height="8" rx="4" fill="#5794E0"/>
    <rect x="14" y="42" width="80" height="6" rx="3" fill="#3A5A85"/>
    <rect x="14" y="58" width="80" height="6" rx="3" fill="#3A5A85"/>
    <rect x="14" y="74" width="55" height="6" rx="3" fill="#3A5A85"/>
  </g>
  <text x="160" y="360" fill="#8FA9C9" font-size="18" text-anchor="middle">Документы</text>

  <path d="M 250 240 H 320" stroke="#5794E0" stroke-width="4" marker-end="url(#a1)"/>

  <!-- dataset grid (right) -->
  <g transform="translate(340,120)">
    <rect width="330" height="240" rx="14" fill="#223A5E" stroke="#5794E0" stroke-width="2"/>
    <!-- table rows -->
    <rect x="22" y="26" width="120" height="10" rx="5" fill="#5794E0"/>
    <rect x="160" y="26" width="70" height="10" rx="5" fill="#58C184"/>
    <rect x="250" y="26" width="56" height="10" rx="5" fill="#5794E0"/>
    <g fill="#3A5A85">
      <rect x="22" y="62" width="200" height="8" rx="4"/>
      <rect x="22" y="88" width="240" height="8" rx="4"/>
      <rect x="22" y="114" width="180" height="8" rx="4"/>
      <rect x="22" y="140" width="220" height="8" rx="4"/>
      <rect x="22" y="166" width="160" height="8" rx="4"/>
      <rect x="22" y="192" width="210" height="8" rx="4"/>
    </g>
    <!-- label tags column -->
    <g>
      <rect x="256" y="58" width="52" height="14" rx="7" fill="#58C184" opacity="0.85"/>
      <rect x="256" y="84" width="52" height="14" rx="7" fill="#5794E0" opacity="0.85"/>
      <rect x="256" y="110" width="52" height="14" rx="7" fill="#58C184" opacity="0.85"/>
      <rect x="256" y="136" width="52" height="14" rx="7" fill="#5794E0" opacity="0.85"/>
      <rect x="256" y="162" width="52" height="14" rx="7" fill="#58C184" opacity="0.85"/>
      <rect x="256" y="188" width="52" height="14" rx="7" fill="#5794E0" opacity="0.85"/>
    </g>
  </g>
  <text x="505" y="400" fill="#8FA9C9" font-size="18" text-anchor="middle">Датасет с метками</text>

  <!-- clean check -->
  <g transform="translate(400,450)">
    <circle r="40" fill="none" stroke="#58C184" stroke-width="4"/>
    <path d="M -16 0 L -5 13 L 19 -14" stroke="#58C184" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="400" y="530" fill="#8FA9C9" font-size="18" text-anchor="middle">Чисто: без дублей и мусора</text>

  <marker id="a1" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5794E0"/>
  </marker>
</svg>
