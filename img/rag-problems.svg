<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4b"/>
      <stop offset="1" stop-color="#09348B"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2fb"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#02102e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 270 H1920 M0 540 H1920 M0 810 H1920"/>
    <path d="M320 0 V1080 M640 0 V1080 M960 0 V1080 M1280 0 V1080 M1600 0 V1080"/>
  </g>

  <!-- left: document being chunked -->
  <g transform="translate(330,220)" filter="url(#soft)">
    <rect x="0" y="0" width="380" height="640" rx="18" fill="url(#card)"/>
    <rect x="40" y="60" width="200" height="26" rx="13" fill="#09348B" opacity="0.85"/>
    <g fill="#94a3c4">
      <rect x="40" y="130" width="300" height="14" rx="7"/>
      <rect x="40" y="164" width="260" height="14" rx="7"/>
      <rect x="40" y="198" width="285" height="14" rx="7"/>
    </g>
    <rect x="40" y="260" width="300" height="86" rx="12" fill="#dbe6ff"/>
    <g fill="#8fa5d6">
      <rect x="64" y="286" width="250" height="12" rx="6"/>
      <rect x="64" y="312" width="200" height="12" rx="6"/>
    </g>
    <rect x="40" y="386" width="300" height="86" rx="12" fill="#dbe6ff"/>
    <g fill="#8fa5d6">
      <rect x="64" y="412" width="250" height="12" rx="6"/>
      <rect x="64" y="438" width="225" height="12" rx="6"/>
    </g>
    <rect x="40" y="512" width="300" height="86" rx="12" fill="#dbe6ff"/>
    <g fill="#8fa5d6">
      <rect x="64" y="538" width="250" height="12" rx="6"/>
      <rect x="64" y="564" width="170" height="12" rx="6"/>
    </g>
  </g>

  <!-- arrows from chunks -->
  <g stroke="#7fd4ff" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M760 360 C 850 360, 880 420, 950 452"/>
    <path d="M760 478 C 850 478, 880 500, 950 512"/>
    <path d="M760 596 C 850 596, 880 580, 950 572"/>
  </g>
  <g fill="#7fd4ff">
    <path d="M975 452 l-34 -14 v28 z"/>
    <path d="M975 512 l-34 -14 v28 z"/>
    <path d="M975 572 l-34 -14 v28 z"/>
  </g>

  <!-- middle: chunks as cards -->
  <g filter="url(#soft)">
    <g transform="translate(990,330)">
      <rect width="240" height="120" rx="14" fill="#12317a" stroke="#4f74d9" stroke-width="3"/>
      <rect x="24" y="34" width="150" height="12" rx="6" fill="#a9c2ff"/>
      <rect x="24" y="66" width="190" height="12" rx="6" fill="#5f7fc9"/>
    </g>
    <g transform="translate(990,470)">
      <rect width="240" height="120" rx="14" fill="#12317a" stroke="#4f74d9" stroke-width="3"/>
      <rect x="24" y="34" width="175" height="12" rx="6" fill="#a9c2ff"/>
      <rect x="24" y="66" width="140" height="12" rx="6" fill="#5f7fc9"/>
    </g>
    <g transform="translate(990,610)">
      <rect width="240" height="120" rx="14" fill="#12317a" stroke="#4f74d9" stroke-width="3"/>
      <rect x="24" y="34" width="130" height="12" rx="6" fill="#a9c2ff"/>
      <rect x="24" y="66" width="185" height="12" rx="6" fill="#5f7fc9"/>
    </g>
  </g>

  <!-- right: search/answer node -->
  <g filter="url(#soft)">
    <circle cx="1500" cy="540" r="170" fill="#0e2a66" stroke="#4f74d9" stroke-width="6"/>
    <circle cx="1462" cy="502" r="78" fill="none" stroke="#7fd4ff" stroke-width="26"/>
    <line x1="1518" y1="558" x2="1584" y2="624" stroke="#7fd4ff" stroke-width="30" stroke-linecap="round"/>
  </g>

  <!-- warning sparks: typical problems -->
  <g fill="#ffd166" opacity="0.95">
    <path d="M880 250 l14 40 42 6 -32 28 10 42 -34 -24 -34 24 10 -42 -32 -28 42 -6 z" transform="translate(0,-10)"/>
    <path d="M1330 250 l14 40 42 6 -32 28 10 42 -34 -24 -34 24 10 -42 -32 -28 42 -6 z" transform="scale(0.7) translate(560,90)"/>
  </g>

  <!-- subtle glow circles -->
  <circle cx="1700" cy="150" r="230" fill="#7fd4ff" opacity="0.06"/>
  <circle cx="180" cy="960" r="260" fill="#7fd4ff" opacity="0.06"/>
</svg>
