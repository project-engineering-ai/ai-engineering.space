<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4b"/>
      <stop offset="1" stop-color="#09348B"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2fb"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#02102e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 270 H1920 M0 540 H1920 M0 810 H1920"/>
    <path d="M320 0 V1080 M640 0 V1080 M960 0 V1080 M1280 0 V1080 M1600 0 V1080"/>
  </g>

  <!-- left: stack of source documents -->
  <g transform="translate(330,220)" filter="url(#soft)">
    <g transform="translate(28,24) rotate(2)">
      <rect width="380" height="640" rx="18" fill="#d6def2"/>
    </g>
    <g transform="translate(14,12) rotate(1)">
      <rect width="380" height="640" rx="18" fill="#e9eef9"/>
    </g>
    <rect x="0" y="0" width="380" height="640" rx="18" fill="url(#card)"/>
    <rect x="40" y="60" width="200" height="26" rx="13" fill="#09348B" opacity="0.85"/>
    <g fill="#94a3c4">
      <rect x="40" y="130" width="300" height="14" rx="7"/>
      <rect x="40" y="164" width="260" height="14" rx="7"/>
      <rect x="40" y="198" width="285" height="14" rx="7"/>
      <rect x="40" y="246" width="300" height="14" rx="7"/>
      <rect x="40" y="280" width="230" height="14" rx="7"/>
    </g>
    <!-- embedded table -->
    <rect x="40" y="340" width="300" height="120" rx="12" fill="#dbe6ff"/>
    <g stroke="#8fa5d6" stroke-width="4">
      <line x1="40" y1="380" x2="340" y2="380"/>
      <line x1="40" y1="420" x2="340" y2="420"/>
      <line x1="140" y1="340" x2="140" y2="460"/>
      <line x1="240" y1="340" x2="240" y2="460"/>
    </g>
    <!-- picture block -->
    <rect x="40" y="500" width="140" height="100" rx="12" fill="#8fa5d6"/>
    <circle cx="85" cy="540" r="16" fill="#eef2fb"/>
    <path d="M52 588 l30 -30 22 22 18 -14 30 22 z" fill="#eef2fb"/>
    <g fill="#94a3c4">
      <rect x="200" y="510" width="140" height="12" rx="6"/>
      <rect x="200" y="538" width="115" height="12" rx="6"/>
      <rect x="200" y="566" width="130" height="12" rx="6"/>
    </g>
  </g>

  <!-- arrows: pipeline to processing -->
  <g stroke="#7fd4ff" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M760 420 C 850 420, 880 460, 950 486"/>
    <path d="M760 540 H 950"/>
    <path d="M760 660 C 850 660, 880 620, 950 594"/>
  </g>
  <g fill="#7fd4ff">
    <path d="M975 486 l-34 -14 v28 z"/>
    <path d="M975 540 l-34 -14 v28 z"/>
    <path d="M975 594 l-34 -14 v28 z"/>
  </g>

  <!-- middle: processing steps -->
  <g filter="url(#soft)">
    <g transform="translate(990,330)">
      <rect width="240" height="120" rx="14" fill="#12317a" stroke="#4f74d9" stroke-width="3"/>
      <path d="M34 52 l14 14 26 -30" fill="none" stroke="#7fd4ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="80" y="34" width="130" height="12" rx="6" fill="#a9c2ff"/>
      <rect x="80" y="66" width="95" height="12" rx="6" fill="#5f7fc9"/>
    </g>
    <g transform="translate(990,470)">
      <rect width="240" height="120" rx="14" fill="#12317a" stroke="#4f74d9" stroke-width="3"/>
      <path d="M34 52 l14 14 26 -30" fill="none" stroke="#7fd4ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="80" y="34" width="110" height="12" rx="6" fill="#a9c2ff"/>
      <rect x="80" y="66" width="130" height="12" rx="6" fill="#5f7fc9"/>
    </g>
    <g transform="translate(990,610)">
      <rect width="240" height="120" rx="14" fill="#12317a" stroke="#4f74d9" stroke-width="3"/>
      <path d="M34 52 l14 14 26 -30" fill="none" stroke="#7fd4ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="80" y="34" width="140" height="12" rx="6" fill="#a9c2ff"/>
      <rect x="80" y="66" width="100" height="12" rx="6" fill="#5f7fc9"/>
    </g>
  </g>

  <!-- arrows: to result -->
  <g stroke="#7fd4ff" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M1260 480 C 1340 480, 1360 510, 1420 526"/>
    <path d="M1260 600 C 1340 600, 1360 570, 1420 554"/>
  </g>
  <g fill="#7fd4ff">
    <path d="M1445 526 l-34 -14 v28 z"/>
    <path d="M1445 554 l-34 -14 v28 z"/>
  </g>

  <!-- right: clean structured output -->
  <g transform="translate(1470,340)" filter="url(#soft)">
    <rect width="300" height="400" rx="18" fill="url(#card)"/>
    <rect x="32" y="36" width="140" height="22" rx="11" fill="#09348B" opacity="0.85"/>
    <g>
      <rect x="32" y="96" width="236" height="66" rx="10" fill="#dbe6ff"/>
      <rect x="48" y="118" width="160" height="10" rx="5" fill="#8fa5d6"/>
      <rect x="48" y="140" width="120" height="10" rx="5" fill="#8fa5d6"/>
      <rect x="32" y="182" width="236" height="66" rx="10" fill="#dbe6ff"/>
      <rect x="48" y="204" width="180" height="10" rx="5" fill="#8fa5d6"/>
      <rect x="48" y="226" width="130" height="10" rx="5" fill="#8fa5d6"/>
      <rect x="32" y="268" width="236" height="66" rx="10" fill="#dbe6ff"/>
      <rect x="48" y="290" width="150" height="10" rx="5" fill="#8fa5d6"/>
      <rect x="48" y="312" width="170" height="10" rx="5" fill="#8fa5d6"/>
    </g>
    <!-- quality badge -->
    <g transform="translate(196,330)">
      <circle cx="36" cy="36" r="34" fill="#0e2a66" stroke="#4f74d9" stroke-width="4"/>
      <path d="M20 36 l11 11 21 -24" fill="none" stroke="#7fd4ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- subtle glow circles -->
  <circle cx="1700" cy="150" r="230" fill="#7fd4ff" opacity="0.06"/>
  <circle cx="180" cy="960" r="260" fill="#7fd4ff" opacity="0.06"/>
</svg>
